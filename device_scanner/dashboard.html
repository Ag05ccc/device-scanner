<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Scanner</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172b3a; background: #f3f5f7; }
    body { max-width: 1080px; padding: 30px 20px; margin: auto; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 1.8rem; } h2 { margin: 0; font-size: 1.15rem; }
    .subtitle, .muted { color: #566775; } .subtitle { margin-bottom: 28px; }
    #connection { padding: 8px 12px; border-radius: 8px; background: #e3e8ed; }
    #connection.ok { color: #146b48; background: #e2f3e9; }
    #connection.bad { color: #a93232; background: #fce9e8; }
    #nodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr)); gap: 16px; }
    article { border: 1px solid #d8e0e6; background: white; padding: 20px; border-radius: 10px; min-width: 0; }
    article.offline { border-color: #c7cdd3; background: #fafafa; }
    .node-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .badge { font-size: .85rem; border-radius: 5px; padding: 3px 7px; background: #edf1f5; }
    .online { color: #146b48; } .offline-text { color: #9d3939; }
    section { border-top: 1px solid #e8edf1; margin-top: 16px; padding-top: 12px; }
    h3 { margin: 0 0 8px; font-size: .95rem; } p { line-height: 1.5; }
    .error { color: #a93232; overflow-wrap: anywhere; }
    details { margin-top: 10px; } summary { cursor: pointer; font-size: .9rem; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f3f5f7; padding: 12px; border-radius: 6px; font-size: .8rem; max-height: 350px; overflow-y: auto; }
    .empty { padding: 24px; border: 1px dashed #aebbc6; border-radius: 10px; }
    footer { margin-top: 28px; font-size: .85rem; }
  </style>
</head>
<body>
  <header><h1>Device Scanner</h1><div id="connection" role="status">Sunucuya bağlanılıyor…</div></header>
  <p class="subtitle">Node bağlantıları ve son Bluetooth / Wi-Fi taramaları</p>
  <main id="nodes"><p class="empty">Node bilgileri bekleniyor…</p></main>
  <footer class="muted">İki saniyede bir yenilenir. Bu başlangıç sürümünde sonuçlar sunucu belleğinde tutulur.</footer>
  <script>
    const container = document.querySelector('#nodes');
    const connection = document.querySelector('#connection');
    const expanded = new Set();
    let requestId = 0;
    function element(tag, text, className) {
      const item = document.createElement(tag);
      if (text !== undefined) item.textContent = text;
      if (className) item.className = className;
      return item;
    }
    function dateText(value) {
      return value ? new Date(value).toLocaleString('tr-TR') : 'Henüz yok';
    }
    function render(nodes) {
      container.replaceChildren();
      if (!nodes.length) {
        container.append(element('p', 'Henüz bağlı node yok. Bir node başlattığınızda burada görünecek.', 'empty'));
        return;
      }
      for (const node of nodes) {
        const card = element('article', undefined, node.online ? '' : 'offline');
        const head = element('div', undefined, 'node-head');
        head.append(element('h2', node.node_id), element('span', node.scanner === 'dummy' ? 'Dummy' : 'Gerçek cihaz', 'badge'));
        card.append(head, element('p', node.online ? '● Çevrimiçi' : '● Çevrimdışı', node.online ? 'online' : 'offline-text'));
        card.append(element('p', 'Son iletişim: ' + dateText(node.last_seen), 'muted'));
        for (const [radio, title] of [['bluetooth', 'Bluetooth'], ['wifi', 'Wi-Fi']]) {
          const data = node.radios[radio];
          const section = element('section');
          section.append(element('h3', title));
          if (data.status === 'waiting') section.append(element('p', 'Tarama bekleniyor.', 'muted'));
          else if (data.status === 'error') section.append(element('p', 'Tarama hatası: ' + data.error, 'error'));
          else section.append(element('p', data.observations.length + ' cihaz / ağ gözlendi.'));
          if (data.received_at) section.append(element('p', 'Son rapor: ' + dateText(data.received_at), 'muted'));
          if (data.status !== 'waiting') {
            const details = element('details');
            const key = node.node_id + ':' + radio;
            details.open = expanded.has(key);
            details.addEventListener('toggle', () => {
              if (!details.isConnected) return;
              if (details.open) expanded.add(key); else expanded.delete(key);
            });
            const label = data.status === 'error' ? 'Önceki başarılı taramanın verileri' : 'Tarama verileri';
            details.append(element('summary', label), element('pre', JSON.stringify(data.observations, null, 2)));
            section.append(details);
          }
          card.append(section);
        }
        container.append(card);
      }
    }
    function disconnected() {
      connection.textContent = 'Sunucu bağlantısı yok';
      connection.className = 'bad';
      container.replaceChildren(element('p', 'Sunucuya ulaşılamıyor. Node durumları doğrulanamıyor; bağlantı yeniden deneniyor.', 'empty'));
    }
    async function poll() {
      const currentRequest = ++requestId;
      const controller = new AbortController();
      const timeout = setTimeout(() => {
        controller.abort();
        if (currentRequest === requestId) disconnected();
      }, 4000);
      try {
        const response = await fetch('/api/nodes', {cache: 'no-store', signal: controller.signal});
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        if (!Array.isArray(data.nodes)) throw new Error('Geçersiz yanıt');
        render(data.nodes);
        connection.textContent = 'Sunucuya bağlı';
        connection.className = 'ok';
      } catch (_) { disconnected(); }
      finally { clearTimeout(timeout); setTimeout(poll, 2000); }
    }
    poll();
  </script>
</body>
</html>
